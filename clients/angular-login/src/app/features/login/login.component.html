<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>InterviewPrep Login</h1>
    <p class="hint">Try <code>admin / Admin123!</code> or <code>staff / Staff123!</code></p>

    <label for="username">Username</label>
    <input id="username" type="text" formControlName="username" autocomplete="username" />
    @if (username.invalid && username.touched) {
      <p class="field-error">Username is required.</p>
    }

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (password.invalid && password.touched) {
      <p class="field-error">Password must be at least 4 characters.</p>
    }

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
